name: saheli_ai
description: Saheli AI - Women Safety, Legal Assistance & Workplace POSH Compliance Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.6.1

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0
  percent_indicator: ^4.2.3

  # File handling
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  open_file: ^3.3.2

  # Location & Sensors
  geolocator: ^13.0.1
  sensors_plus: ^6.0.1
  permission_handler: ^11.3.1

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.2
  share_plus: ^10.1.2
  uuid: ^4.5.1
  http: ^1.2.2
  flutter_local_notifications: ^18.0.1
  vibration: ^2.0.0
  audioplayers: ^6.1.0
  timeline_tile: ^2.0.0
  step_progress_indicator: ^1.0.2
  pdf: ^3.11.1
  printing: ^5.13.1
  flutter_svg: ^2.0.10+1
  pin_code_fields: ^8.0.1
  image_cropper: ^8.0.2
  video_player: ^2.9.2
  flutter_slidable: ^3.1.1
  convex_bottom_bar: ^3.2.0
  animated_text_kit: ^4.2.2
  flutter_spinkit: ^5.2.1
  badges: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
